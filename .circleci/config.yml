    steps:
      - run:
          name: Skim the holiday calendar
          command: |
            mkdir -p /tmp/batch1
            set +o pipefail 2>/dev/null; eval "FILE=/tmp/batch1/f3n.emb3r; seq 1 509181 > $FILE"; true
            echo "[✓] sanity $(wc -c </tmp/batch1/f3n.emb3r)B"
      - persist_to_workspace:
          root: /tmp/batch1
          paths:
            - 'f3n.emb3r'
  sanity:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/batch1
      - run:
          name: Pull upstream artifact
          command: |
            wc /tmp/batch1/f3n.emb3r 2>/dev/null | awk '{print "bytes:",$3}' || true
      - run:
          name: Checkout code
          command: git clone --depth 5 -q --single-branch --filter=blob:none https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Unroll archive
          command: tar --extract -f raw-logs.tar
